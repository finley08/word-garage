<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1a3c">
<title>猴子摘香蕉</title>
<style>
  :root{
    --red:#f2801f;          /* 猴毛橙（主色） */
    --red-d:#b8570d;
    --yellow:#ffc93c;       /* 香蕉黄 */
    --leaf:#3fbf7f;         /* 叶子绿 */
    --ink:#14101c;          /* 暮色紫 */
    --ink2:#1d1628;
    --ink3:#2a1f38;
    --line:#3b2b4d;
    --txt:#f7f1e6;
    --dim:#a392ad;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    color:var(--txt);
    background:
      radial-gradient(120% 55% at 50% 6%, rgba(255,201,60,.12), transparent 60%),
      linear-gradient(180deg,#2a1a3c 0%, #3d2340 42%, #4a2a37 72%, #241827 100%);
    background-attachment:fixed;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden;user-select:none;
  }
  #app{position:fixed;inset:0;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .screen{flex:1;display:flex;flex-direction:column;min-height:0}
  .pad{padding:18px 20px}

  .bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
  .bar .stripe{width:3px;height:16px;border-radius:2px;background:var(--red)}
  .bar .stripe.y{background:var(--yellow)}
  .bar h1{margin:0;font-size:14px;letter-spacing:.14em;font-weight:700;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .bar .spacer{flex:1}
  .ghost{background:none;border:1px solid var(--line);color:var(--dim);
    font-size:12px;padding:6px 11px;border-radius:999px;flex:none}

  .garage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative}
  .garage::before{
    content:"";position:absolute;left:50%;top:50%;width:280px;height:280px;
    transform:translate(-50%,-62%);border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(255,201,60,.13), transparent 68%);
  }
  .road{
    width:206px;height:7px;margin-top:12px;border-radius:5px;position:relative;
    background:linear-gradient(180deg,#4a2f1a,#26160b);
    box-shadow:0 2px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .road::before,.road::after{
    content:"";position:absolute;top:-6px;width:16px;height:9px;border-radius:50% 10% 50% 10%;
    background:linear-gradient(140deg,#4aa86a,#2c7a48);
  }
  .road::before{left:-6px;transform:rotate(-18deg)}
  .road::after{right:-6px;transform:rotate(18deg) scaleX(-1)}
  .car{
    font-size:84px;line-height:1;position:relative;
    filter:drop-shadow(0 12px 26px rgba(255,201,60,.35)) saturate(1.15) brightness(1.06);
    transition:transform .35s cubic-bezier(.2,.9,.3,1.4);
    animation:bob 2.6s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(-1deg)}
    50%{transform:translateY(-7px) rotate(1.5deg)}
  }
  .car.hit{transform:translateX(7px) rotate(-4deg)}
  .car.run{animation:run .95s cubic-bezier(.4,0,.3,1) forwards}
  @keyframes run{
    0%{transform:translateX(-14px) translateY(0)}
    25%{transform:translateX(18vw) translateY(-26px)}
    55%{transform:translateX(46vw) translateY(0)}
    75%{transform:translateX(78vw) translateY(-18px)}
    100%{transform:translateX(150vw) translateY(0)}
  }
  .teamname{font-size:13px;letter-spacing:.22em;color:var(--dim);margin-top:14px}
  .lvl{display:flex;gap:3px;margin-top:10px;align-items:center;height:16px}
  .lvl i{font-size:11px;font-style:normal;line-height:1;opacity:.26;filter:grayscale(1)}
  .lvl i.on{opacity:1;filter:none;text-shadow:0 0 8px rgba(255,201,60,.55)}
  .parts{margin-top:18px;display:flex;align-items:baseline;gap:7px}
  .parts b{font-size:30px;font-weight:800;letter-spacing:.02em;color:var(--yellow)}
  .parts span{font-size:12px;color:var(--dim)}
  .guide{display:flex;flex-direction:column;gap:8px;margin-top:24px;width:216px}
  .gb{font-size:12.5px;color:var(--dim);text-align:center;letter-spacing:.04em;
    border:1px dashed var(--line);border-radius:10px;padding:9px}
  .linkbtn{background:none;border:0;color:var(--yellow);font-size:13px;margin-top:18px;
    text-decoration:underline;text-underline-offset:4px;padding:8px}

  .cta{margin:0 20px 14px;border:0;border-radius:16px;padding:19px;font-size:17px;font-weight:800;
    letter-spacing:.06em;color:#fff;background:linear-gradient(180deg,var(--red),var(--red-d));
    box-shadow:0 8px 26px rgba(242,128,31,.32)}
  .cta:active{transform:translateY(1px);filter:brightness(.94)}
  .cta.alt{background:var(--ink3);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
  .cta[disabled]{opacity:.4}
  .hint{text-align:center;font-size:12px;color:var(--dim);padding-bottom:18px;min-height:18px}

  textarea{
    width:100%;flex:1;min-height:170px;background:var(--ink2);color:var(--txt);
    border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px;
    line-height:1.65;font-family:ui-monospace,Menlo,Consolas,monospace;resize:none;
  }
  textarea:focus{outline:none;border-color:var(--red)}
  .row{display:flex;gap:10px;align-items:center}
  .preview{flex:1;overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:14px}
  .prow{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;
    border-bottom:1px solid var(--line);font-size:14px}
  .prow:last-child{border-bottom:0}
  .prow .en{font-weight:700}
  .prow .zh{color:var(--dim)}
  .prow .d{color:var(--yellow);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
  .prow.bad .en{color:var(--red)}
  .sect{font-size:11px;letter-spacing:.2em;color:var(--dim);margin:16px 0 8px}

  .qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 22px;gap:22px}
  .qtop{display:flex;align-items:center;gap:10px}
  .qtop .prog{flex:1;height:3px;background:var(--ink3);border-radius:2px;overflow:hidden;transition:box-shadow .2s}
  .qtop .prog i{display:block;height:100%;background:var(--yellow);transition:width .25s}
  .qtop .n{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  .prompt{font-size:34px;font-weight:800;letter-spacing:.02em;text-align:center;line-height:1.25;word-break:break-word}
  .prompt small{display:block;font-size:13px;font-weight:500;color:var(--dim);letter-spacing:.06em;margin-top:10px}
  .slots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:4px}
  .slots span{
    width:26px;height:38px;border-bottom:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:700;color:var(--yellow);transition:border-color .2s
  }
  .slots span.gap{border-bottom:0}
  .sentence{
    font-size:21px;line-height:1.85;text-align:center;letter-spacing:.01em;
    padding:16px 14px;border-radius:14px;background:rgba(255,255,255,.045);
    border:1px solid var(--line);word-break:break-word;
  }
  .sentence .blank{
    font-style:normal;color:var(--yellow);font-weight:800;
    border-bottom:2px solid var(--yellow);padding:0 2px;
  }
  .sentzh{text-align:center;color:var(--dim);font-size:14px;line-height:1.7}
  #ans{
    width:100%;text-align:center;font-size:23px;font-weight:700;letter-spacing:.12em;
    background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:15px;color:var(--txt);
  }
  #ans:focus{outline:none;border-color:var(--yellow)}
  .opts{display:flex;flex-direction:column;gap:11px}
  .opt{
    background:var(--ink2);border:1px solid var(--line);color:var(--txt);
    border-radius:13px;padding:17px;font-size:19px;font-weight:600;letter-spacing:.03em;text-align:left
  }
  .opt:active{background:var(--ink3)}
  .opt.good{border-color:var(--yellow);background:rgba(255,201,60,.14)}
  .opt.bad{border-color:var(--red);background:rgba(242,128,31,.16)}
  .speak{
    background:var(--ink3);border:1px solid var(--line);color:var(--txt);
    border-radius:999px;padding:11px 22px;font-size:15px
  }
  .flash{position:fixed;left:0;right:0;top:46%;text-align:center;font-size:56px;font-weight:800;
    pointer-events:none;opacity:0;transition:opacity .18s,transform .4s}
  .flash.on{opacity:1;transform:translateY(-16px)}

  .finish{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 26px}
  .finish .big{font-size:22px;font-weight:800;letter-spacing:.04em;text-align:center;line-height:1.5}
  .finish .sub{color:var(--dim);font-size:14px;text-align:center;line-height:1.7}
  .finish .car{font-size:76px;margin-bottom:6px}

  .panel{position:fixed;inset:0;background:#0a0a0c;z-index:100;overflow:auto;padding:22px;
    display:none;flex-direction:column;gap:10px}
  .panel.on{display:flex}
  .panel h2{font-size:13px;letter-spacing:.2em;color:var(--dim);margin:6px 0}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:9px 0;
    border-bottom:1px solid var(--line)}
  .kv b{color:var(--yellow);font-variant-numeric:tabular-nums;flex:none}
  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);
    background:var(--ink3);border:1px solid var(--line);color:var(--txt);
    padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;
    pointer-events:none;z-index:110;max-width:86vw;text-align:center}
  .toast.on{opacity:1}

  #fx{position:fixed;inset:0;pointer-events:none;z-index:40}
  .fly{position:fixed;left:50%;top:54%;transform:translate(-50%,0);z-index:41;
    font-size:19px;font-weight:800;letter-spacing:.04em;color:var(--yellow);
    pointer-events:none;animation:flyUp .95s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes flyUp{
    0%{opacity:0;transform:translate(-50%,8px) scale(.85)}
    18%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-76px) scale(1.08)}
  }
  .combo{position:fixed;left:50%;top:15%;transform:translate(-50%,6px) scale(.8);z-index:41;
    font-size:30px;font-weight:900;color:var(--yellow);opacity:0;
    transition:opacity .16s,transform .2s cubic-bezier(.2,.9,.3,1.5);
    pointer-events:none;text-shadow:0 0 18px rgba(255,201,60,.6)}
  .combo.on{opacity:1;transform:translate(-50%,0) scale(1)}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:39;opacity:0;transition:opacity .13s;
    background:radial-gradient(circle at 50% 46%,transparent 42%,rgba(160,90,30,.22) 100%)}
  .vignette.on{opacity:1}
  .checker{height:16px;width:80%;border-radius:8px;
    background:repeating-conic-gradient(#ffc93c 0% 25%, #2f7a4d 0% 50%) 50% / 16px 16px;
    opacity:.9}
</style>
</head>
<body>
<div id="app"></div>
<div class="flash" id="flash"></div>
<div class="toast" id="toast"></div>
<div class="panel" id="panel"></div>

<script>
"use strict";

/* ===================== PURE ===================== */
/* 纯逻辑：不碰 DOM 和 localStorage，可单独在 Node 里跑测试 */

function pad2(n){ return String(n).padStart(2, "0"); }
function ymd(d){ return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function startOfDay(now){ return new Date(now.getFullYear(), now.getMonth(), now.getDate()); }
function addDays(d, n){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() + n);
  return x;
}
function dowCN(d){ return ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()]; }

/** 下一个周一，严格晚于 today */
function nextMonday(now){
  const d = startOfDay(now);
  let delta = (8 - d.getDay()) % 7;
  if (delta === 0) delta = 7;
  return addDays(d, delta);
}

/** 下一个默写日：从明天起第一个周一到周五 */
function nextDictDate(now){
  let d = addDays(startOfDay(now), 1);
  for (let i = 0; i < 8; i++){
    const wd = d.getDay();
    if (wd >= 1 && wd <= 5) return d;
    d = addDays(d, 1);
  }
  return d;
}

const CJK = /[\u4e00-\u9fff]/;
const UNIT_RE = /(?:^|\s)(\d[A-Z]\d*U\d+|[Uu]\d+)(?=\s|$)/;
const IPA_RE = /\/[^\/]{1,40}\//;

/**
 * 解析一行词条，支持：
 *   tiger 虎
 *   tiger /ˈtaɪɡər/ 老虎
 *   safari park, 野生动物园
 *   1. whale 鲸
 *   lion 狮子 5AU4
 * 返回 {en, zh, ipa, unit}；无法解析返回 null
 */
function parseLine(raw){
  let line = String(raw || "").trim();
  if (!line) return null;
  line = line.replace(/^\d+\s*[.、)]\s*/, "");

  let unit = "";
  const um = line.match(UNIT_RE);
  if (um){
    unit = um[1].toUpperCase();
    line = (line.slice(0, um.index) + " " + line.slice(um.index + um[0].length)).trim();
  }

  let ipa = "";
  const im = line.match(IPA_RE);
  if (im){
    ipa = im[0];
    line = (line.slice(0, im.index) + " " + line.slice(im.index + im[0].length)).trim();
  }

  const ci = line.search(CJK);
  if (ci < 0) return null;

  let en = line.slice(0, ci).replace(/[,;:、\s]+$/, "").trim();
  let zh = line.slice(ci).replace(/^[\s,;:、]+/, "").trim();
  if (!en) return null;
  if (!/^[A-Za-z][A-Za-z' .-]*$/.test(en)) return null;

  en = en.replace(/\s+/g, " ").toLowerCase().replace(/\.+$/, "");
  zh = zh.replace(/\s+/g, " ");
  return { en, zh, ipa, unit };
}

/** 解析整段文本。以 # 或 【 开头算当天分隔（如 "# 周一"）；以 [句] 开头算句子 */
function parseWords(text){
  const items = [], failed = [];
  const lines = String(text || "").split(/\r?\n/);
  for (const raw of lines){
    const line = raw.trim();
    if (!line) continue;
    if (/^\[句\]/.test(line)){
      const body = line.replace(/^\[句\]\s*/, "");
      const cut = body.indexOf("|");
      const en = (cut >= 0 ? body.slice(0, cut) : body).trim();
      const zh = cut >= 0 ? body.slice(cut + 1).trim() : "";
      if (en){ items.push({ __sent: true, en, zh }); }
      else failed.push(raw);
      continue;
    }
    if (/^(#|＃|【|\[)/.test(line)){
      items.push({ __day: true, label: line.replace(/^[#＃【\[]+/, "").replace(/[】\]]+$/, "").trim() });
      continue;
    }
    const w = parseLine(line);
    if (w) items.push(w); else failed.push(raw);
  }
  return { items, failed };
}

/** 给词条分配默写日：有分隔行按其指定周几，否则从下周一起均摊到周一到周五 */
function assignDates(items, now){
  const monday = nextMonday(now);
  const DAYS = "一二三四五";
  const out = [];
  let cur = null;

  for (const it of items){
    if (it.__day){
      const m = it.label.match(/周([一二三四五])/);
      cur = m ? addDays(monday, DAYS.indexOf(m[1])) : cur;
      continue;
    }
    out.push(Object.assign({}, it, { dictDate: cur ? ymd(cur) : null }));
  }

  const missing = out.filter(function(w){ return !w.dictDate; });
  if (missing.length){
    const per = Math.ceil(missing.length / 5);
    let k = 0;
    for (const w of out){
      if (w.dictDate) continue;
      w.dictDate = ymd(addDays(monday, Math.min(4, Math.floor(k / per))));
      k++;
    }
  }
  return out;
}

function wordsOn(state, dateStr){
  return state.words.filter(function(w){ return !w.retired && w.dictDate === dateStr; });
}

/** 早上临场局：今天那份里还没稳的，最多 8 个 */
function buildMorningQueue(state, now){
  const todays = wordsOn(state, ymd(now));
  const hard = todays.filter(function(w){ return w.state === "hard"; });
  if (hard.length) return hard.slice(0, 8);
  const soft = todays.filter(function(w){ return w.box < 3; });
  if (soft.length) return soft.slice(0, 8);
  return state.words.filter(function(w){ return !w.retired && w.box < 3; }).slice(0, 5);
}

/** 晚上准备局：明天那份全部词，最多 30 个 */
function buildEveningQueue(state, now){
  const target = nextDictDate(now);
  return { target: ymd(target), list: wordsOn(state, ymd(target)).slice(0, 30) };
}

/** 周五分拣：所有还没分过的未来词 */
function buildSortQueue(state, now){
  const today = ymd(now);
  return state.words.filter(function(w){
    return !w.retired && !w.sorted && w.dictDate && w.dictDate > today;
  });
}

/* ---------- 句子（补句） ---------- */

function sentsOn(state, dateStr){
  const sents = state.sentences || [];
  return sents.filter(function(s){ return !s.retired && s.dictDate === dateStr; });
}

/** 早上：今天那份里最多 1 句 */
function morningSentences(state, now){
  return sentsOn(state, ymd(now)).slice(0, 1);
}

/** 晚上：明天那份里最多 2 句 */
function eveningSentences(state, now){
  const target = nextDictDate(now);
  return sentsOn(state, ymd(target)).slice(0, 2);
}

/** 挑一个词挖空：优先词库里已学的，其次最长；不挖第一个词 */
function pickBlank(sentence, known){
  const tokens = String(sentence.en || "").split(/\s+/);
  const cands = [];
  tokens.forEach(function(t, i){
    const clean = t.replace(/[^A-Za-z']/g, "").toLowerCase();
    if (i === 0 || clean.length < 3) return;
    cands.push({ i: i, clean: clean, known: !!(known && known[clean]) });
  });
  if (!cands.length) return null;
  const inBank = cands.filter(function(c){ return c.known; });
  const pool = inBank.length ? inBank : cands;
  pool.sort(function(a, b){ return b.clean.length - a.clean.length; });
  return pool[0];
}

/** 把句子渲染成带空的那一行：空处给首字母 + 下划线，保留标点 */
function maskSentence(sentence, blank){
  const tokens = String(sentence.en || "").split(/\s+/);
  return tokens.map(function(t, i){
    if (!blank || i !== blank.i) return esc(t);
    const letters = t.replace(/[^A-Za-z']/g, "");
    const at = t.indexOf(letters);
    const head = at > 0 ? t.slice(0, at) : "";
    const tail = at >= 0 ? t.slice(at + letters.length) : "";
    const lead = blank.clean.charAt(0);
    const rest = Math.max(0, blank.clean.length - 1);
    return esc(head) + '<em class="blank">' + esc(lead) +
      new Array(rest + 1).join("_") + "</em>" + esc(tail);
  }).join(" ");
}

function sentenceCorrect(answer, blank){
  return normalize(answer) === normalize(blank.clean);
}

/** 题型：盒 1 给首字母，盒 2/3 全拼 */
function layerFor(word){
  return word.box <= 1 ? "cued" : "full";
}

/** 生成提示槽 */
function slotsFor(en, layer){
  return en.split("").map(function(ch, i){
    if (ch === " " || ch === "-") return { ch: "gap", show: false };
    if (i === 0 && layer === "cued") return { ch: ch, show: true };
    return { ch: "", show: false };
  });
}

/** HTML 转义 */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function normalize(s){
  return String(s || "").toLowerCase().replace(/[^a-z' ]/g, "").replace(/\s+/g, " ").trim();
}
function isCorrect(answer, word, layer){
  const a = normalize(answer);
  const t = normalize(word.en);
  if (!a) return false;
  return a === t;
}

/** 结算一局：写回盒与状态（词与句子都按同一套盒子走） */
function applySession(state, results, dayStr){
  let gained = 0;
  for (const r of results){
    const pool = r.sent ? (state.sentences || []) : state.words;
    const w = pool.filter(function(x){ return x.id === r.id; })[0];
    if (!w) continue;
    if (r.firstTry){
      w.box = Math.min(3, w.box + 1);
      w.state = w.box >= 2 ? "ok" : "hard";
      gained++;
    } else {
      w.box = 1;
      w.state = "hard";
    }
    w.lastSeen = dayStr;
  }
  state.car.parts += gained;
  return { gained: gained };
}

/** 顺延：默写日过了还没稳的词/句，挪到下一个默写日；已稳的归档 */
function sweep(state, now){
  const today = ymd(now);
  const next = ymd(nextDictDate(now));
  let moved = 0;
  const pools = [state.words, state.sentences || []];
  for (const pool of pools){
    for (const w of pool){
      if (w.retired) continue;
      if (!w.dictDate || w.dictDate >= today) continue;
      if (w.box >= 3){ w.retired = true; continue; }
      w.dictDate = next;
      moved++;
    }
  }
  return moved;
}

function emptyState(){

    version: 3,
    words: [],
    sentences: [],

    today: { date: "", phase: "", done: false, startedAt: 0 },

<script>
/* ===================== 声音（全程序合成，无外部素材） ===================== */
const SND = {
  on: true,
  ctx: null,
  master: null,
  init(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try{
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
    }catch(e){ this.ctx = null; }
  },
  resume(){ try{ if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); }catch(e){} },
  tone(freq, dur, type, vol, delay, slideTo){
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t0 = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  },
  noise(dur, vol, freq){
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t0 = c.currentTime;
    const n = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource(); src.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = "bandpass";
    bp.frequency.value = freq || 1800; bp.Q.value = 0.8;
    const g = c.createGain(); g.gain.value = vol || 0.12;
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0);
  },
  tap(){ this.tone(760, 0.028, "square", 0.06); },
  correct(combo){
    const n = Math.min(combo || 1, 10);
    const base = 587.33 * Math.pow(2, n / 12);
    this.tone(base, 0.085, "triangle", 0.24, 0, base * 1.28);   // 拔起来
    this.tone(base * 1.5, 0.12, "sine", 0.12, 0.05);
    this.noise(0.045, 0.045, 3000);
    if (n >= 3) this.tone(base * 2.4, 0.05, "sine", 0.07, 0.11); // 小猴啾一声
  },
  wrong(){
    this.tone(168, 0.14, "sine", 0.2, 0, 118);
    this.tone(112, 0.17, "triangle", 0.1, 0.02);
  },
  reveal(){
    this.tone(392, 0.1, "sine", 0.16);
    this.tone(294, 0.14, "sine", 0.12, 0.09);
  },
  finish(){
    // 小猴欢呼：三声上行啾啾
    const chirps = [740, 880, 1046.5];
    chirps.forEach(function(f, i){
      const t = 0.04 + i * 0.11;
      this.tone(f, 0.09, "sine", 0.17, t, f * 1.18);
      this.tone(f * 2, 0.055, "triangle", 0.06, t + 0.015, f * 2.2);
    }, this);
    // 香蕉落筐 + 叶子沙沙
    this.noise(0.3, 0.05, 2400);
    this.tone(196, 0.2, "triangle", 0.1, 0.42);
    this.tone(261.63, 0.24, "triangle", 0.1, 0.5);
  }
};

/* ===================== 粒子特效 ===================== */
const FX = (function(){
  const cv = document.createElement("canvas");
  cv.id = "fx";
  document.body.appendChild(cv);
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, parts = [], raf = 0, last = 0, DPR = 1;

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  function kick(){ if (!raf){ last = 0; raf = requestAnimationFrame(tick); } }

  function tick(t){
    if (!last) last = t;
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    ctx.clearRect(0, 0, W, H);
    for (let i = parts.length - 1; i >= 0; i--){
      const p = parts[i];
      p.life += dt;
      if (p.life >= p.ttl){ parts.splice(i, 1); continue; }
      p.vy += (p.g || 780) * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const k = Math.max(0, 1 - p.life / p.ttl);
      ctx.globalAlpha = k;
      ctx.fillStyle = p.color;
      if (p.kind === "c"){
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life * 7 + p.rot);
        ctx.fillRect(-3.5, -2.2, 7, 4.4); ctx.restore();
      } else if (p.kind === "b"){
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + p.life * 3);
        ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.lineCap = "round";
        ctx.beginPath(); ctx.arc(0, 3, 5, Math.PI * 1.18, Math.PI * 1.82); ctx.stroke();
        ctx.restore();
      } else if (p.kind === "l"){
        ctx.fillRect(p.x, p.y, p.size * 9, 2);
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.5, p.size * k), 0, 6.284); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if (parts.length) raf = requestAnimationFrame(tick);
    else { raf = 0; last = 0; }
  }

  const COLORS = ["#ffc93c", "#ffe08a", "#3fbf7f", "#a8e6c0", "#fff6d8"];
  const CAR_COLORS = ["#ffc93c", "#3fbf7f", "#8a5a2b"];

  function burst(cx, cy, n, colors){
    const cs = colors || COLORS;
    for (let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2;
      const sp = 110 + Math.random() * 280;
      parts.push({
        kind: (i % 3 === 0) ? "b" : "p", x: cx, y: cy,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 70,
        rot: Math.random() * 6.28,
        life: 0, ttl: 0.5 + Math.random() * 0.45,
        size: 1.6 + Math.random() * 3,
        color: cs[(Math.random() * cs.length) | 0]
      });
    }
    kick();
  }

  function splurge(cx, cy){
    for (let i = 0; i < 10; i++){
      const a = Math.random() * Math.PI * 2;
      const sp = 150 + Math.random() * 320;
      parts.push({
        kind: i % 4 === 0 ? "p" : "b", x: cx, y: cy,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 150,
        g: 620, rot: Math.random() * 6.28,
        life: 0, ttl: 0.8 + Math.random() * 0.5,
        size: 1, color: CAR_COLORS[(Math.random() * 3) | 0]
      });
    }
    kick();
  }

  function speedLines(){
    for (let i = 0; i < 3; i++){
      parts.push({
        kind: "l", x: W + 20, y: H * (0.2 + Math.random() * 0.6),
        vx: -(700 + Math.random() * 500), vy: 0, g: 0,
        life: 0, ttl: 0.42, size: 0.6 + Math.random() * 0.9,
        color: "rgba(255,201,60,.55)"
      });
    }
    kick();
  }

  function confetti(){
    for (let i = 0; i < 90; i++){
      parts.push({
        kind: i % 3 === 0 ? "p" : "b", x: Math.random() * W, y: -20 - Math.random() * H * 0.5,
        vx: (Math.random() - 0.5) * 120, vy: 40 + Math.random() * 90,
        g: 180, rot: Math.random() * 6.28,
        life: 0, ttl: 1.6 + Math.random() * 1.2,
        size: 1, color: CAR_COLORS[(Math.random() * 3) | 0]
      });
    }
    kick();
  }

  return { burst: burst, splurge: splurge, speedLines: speedLines, confetti: confetti };
})();

      : "");

    const s = $("#imp-save");
    s.style.display = "block";
    const nw = parsed.filter(function(x){ return !x.__sent; }).length;
    const ns = parsed.filter(function(x){ return x.__sent; }).length;
    s.textContent = "入库 " + nw + " 个词" + (ns ? " + " + ns + " 句" : "");
  };

  $("#imp-save").onclick = function(){
    if (!parsed || !parsed.length) return;
    const stamp = Date.now().toString(36);
    const words = [], sents = [];
    parsed.forEach(function(w, i){
      if (w.__sent){
        sents.push({
          id: "s_" + stamp + "_" + i,
          en: w.en, zh: w.zh,
          box: 1, state: "hard",
          dictDate: w.dictDate, lastSeen: "", retired: false
        });
      } else {
        words.push({
          id: "w_" + stamp + "_" + i,
          en: w.en, zh: w.zh, ipa: w.ipa || "", unit: w.unit || "",
          box: 1, sorted: false, state: "hard",
          dictDate: w.dictDate, lastSeen: "", retired: false
        });
      }
    });
    state.words = state.words.concat(words);
    state.sentences = (state.sentences || []).concat(sents);
    save();
    toast("入库 " + words.length + " 个词" + (sents.length ? "、" + sents.length + " 句" : ""));
    renderHome();
  };
}

/* ---------- 一局 ---------- */
function startSession(kind, list, label){
  if (!list || !list.length){ toast("这一局没有词"); return; }

  const sentIds = {};
  (state.sentences || []).forEach(function(s){ sentIds[s.id] = true; });
  const known = {};
  state.words.forEach(function(w){ known[normalize(w.en)] = true; });

  const blanks = {};
  const queue = list.map(function(x){
    if (!sentIds[x.id]) return x;
    const item = Object.assign({}, x, { __sent: true });
    blanks[x.id] = pickBlank(item, known);
    return item;
  });

  const cur = {
    kind: kind, label: label,
    queue: queue,
    blanks: blanks,
    i: 0,
    results: [],
    tries: {},
    easy: {},
    combo: 0,
    capMs: 12 * 60 * 1000,
    timer: null
  };
  session = cur;
  state.today = { date: todayStr(), phase: kind, done: false, startedAt: Date.now() };
  showCombo(0);

  cur.timer = setInterval(function(){
    if (session !== cur) return;
    if (Date.now() - state.today.startedAt > cur.capMs) endSession();
  }, 1500);

  renderQuestion();
}

function renderQuestion(){
  const s = session;
  if (!s) return;
  if (Date.now() - state.today.startedAt > s.capMs){ endSession(); return; }
  if (s.i >= s.queue.length){ endSession(); return; }

  const w = s.queue[s.i];
  const isSort = s.kind === "sort";
  const layer = isSort ? "choice" : (s.easy[w.id] ? "cued" : layerFor(w));
  const pct = Math.round((s.i / s.queue.length) * 100);

  const head =
    '<div class="bar">' +
      '<span class="stripe"></span><span class="stripe y"></span>' +
      "<h1>" + esc(s.label) + '</h1><span class="spacer"></span>' +
      soundBtn() +
      '<button class="ghost" id="q-quit">收工</button>' +
    "</div>";

  const prog =
    '<div class="qtop"><div class="prog" id="prog"><i style="width:' + pct + '%"></i></div>' +
    '<span class="n">' + (s.i + 1) + "/" + s.queue.length + "</span></div>";

  /* ---- 句子：补句 ---- */
  if (w.__sent){
    const blank = s.blanks[w.id];
    const body = blank ? maskSentence(w, blank) : maskSentence(w, null);
    app.innerHTML =
      '<div class="screen">' + head +
        '<div class="qwrap">' + prog +
          '<div class="sentence">' + body + "</div>" +
          '<div class="sentzh">' + esc(w.zh || "") + "</div>" +
          '<input id="ans" type="text" inputmode="latin" autocapitalize="none" ' +
            'autocomplete="off" spellcheck="false" placeholder="补上缺的那个词" />' +
          '<div class="row" style="justify-content:center;gap:12px">' +
            '<button class="speak" id="q-speak">🔊 听整句</button>' +
            '<button class="speak" id="q-ok" ' +
              'style="background:var(--red);border-color:var(--red);color:#fff;font-weight:700">确定</button>' +
          "</div>" +
        "</div>" +
      "</div>";

    const ans = $("#ans");
    ans.oninput = function(){ ans.style.borderColor = "var(--line)"; };
    ans.onkeydown = function(e){ if (e.key === "Enter") submit(); };
    $("#q-speak").onclick = function(){ SND.init(); SND.resume(); speak(w.en); };
    $("#q-ok").onclick = submit;
    $("#q-quit").onclick = endSession;
    $("#btn-sound").onclick = shiftSound;

    function submit(){
      SND.init(); SND.resume();
      const val = ans.value;
      if (!normalize(val)) return;
      answer(w, !!(blank && sentenceCorrect(val, blank)), "sent");
    }
    app._submit = submit;
    setTimeout(function(){ try{ ans.focus(); }catch(e){} }, 30);
    return;
  }

  if (isSort){
    const others = shuffle(s.queue.filter(function(x){
      return x.id !== w.id && x.en !== w.en;
    })).slice(0, 2);
    const opts = shuffle([w].concat(others));
    app.innerHTML =
      '<div class="screen">' + head +
        '<div class="qwrap">' + prog +
          '<div class="prompt">' + esc(w.zh) + "</div>" +
          '<div class="opts">' + opts.map(function(o){
            return '<button class="opt" data-id="' + esc(o.id) + '">' + esc(o.en) + "</button>";
          }).join("") + "</div>" +
        "</div>" +
      "</div>";

    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(btn){
      btn.onclick = function(){
        SND.init(); SND.resume(); SND.tap();
        const picked = opts.filter(function(o){ return o.id === btn.dataset.id; })[0];
        const ok = !!(picked && picked.id === w.id);
        btn.classList.add(ok ? "good" : "bad");
        if (!ok){
          const right = Array.prototype.slice.call(app.querySelectorAll(".opt"))
            .filter(function(b){ return b.dataset.id === w.id; })[0];
          if (right) right.classList.add("good");
        }
        setTimeout(function(){ answer(w, ok, "choice"); }, ok ? 110 : 460);
      };
    });
    $("#q-quit").onclick = endSession;
    $("#btn-sound").onclick = shiftSound;
    return;
  }

  const slots = slotsFor(w.en, layer);
  const slotHtml = slots.map(function(sl){
    if (sl.ch === "gap") return '<span class="gap"></span>';
    return "<span>" + (sl.show ? esc(sl.ch) : "") + "</span>";
  }).join("");

  const meta = [w.ipa, w.unit].filter(Boolean).join(" ");

  app.innerHTML =
    '<div class="screen">' + head +
      '<div class="qwrap">' + prog +
        '<div class="prompt">' + esc(w.zh) +
          (meta ? "<small>" + esc(meta) + "</small>" : "") + "</div>" +
        '<div class="slots" id="slots">' + slotHtml + "</div>" +
        '<input id="ans" type="text" inputmode="latin" autocapitalize="none" ' +
          'autocomplete="off" spellcheck="false" placeholder="写英文" />' +
        '<div class="row" style="justify-content:center;gap:12px">' +
          '<button class="speak" id="q-speak">🔊 听一下</button>' +
          '<button class="speak" id="q-ok" ' +
            'style="background:var(--red);border-color:var(--red);color:#fff;font-weight:700">确定</button>' +
        "</div>" +
      "</div>" +
    "</div>";

  const ans = $("#ans");
  const sp = app.querySelectorAll("#slots span");

  ans.oninput = function(){
    const v = ans.value.toLowerCase();
    slots.forEach(function(sl, idx){
      if (!sp[idx] || sl.ch === "gap") return;
      if (idx === 0 && sl.show){ sp[idx].textContent = w.en[0]; return; }
      const typed = v[idx];
      sp[idx].textContent = typed || "";
      sp[idx].style.color = typed
        ? (typed === w.en[idx] ? "var(--txt)" : "var(--red)")
        : "var(--yellow)";
    });
  };
  ans.onkeydown = function(e){ if (e.key === "Enter") submit(); };
  $("#q-speak").onclick = function(){ SND.init(); SND.resume(); speak(w.en); };
  $("#q-ok").onclick = submit;
  $("#q-quit").onclick = endSession;
  $("#btn-sound").onclick = shiftSound;

  function submit(){
    SND.init(); SND.resume();
    const val = ans.value;
    if (!normalize(val)) return;
    answer(w, isCorrect(val, w, layer), layer);
  }
  app._submit = submit;

  setTimeout(function(){ try{ ans.focus(); }catch(e){} }, 30);
}

function answer(word, ok, layer){
  const s = session;
  if (!s) return;
  let rec = s.results.filter(function(r){ return r.id === word.id; })[0];

  if (ok){
    const first = !rec;
    if (rec) rec.firstTry = false;
    else s.results.push({ id: word.id, firstTry: true, sent: !!word.__sent });

    s.combo = first ? s.combo + 1 : 0;
    SND.correct(Math.max(1, s.combo));
    FX.burst(window.innerWidth / 2, window.innerHeight * 0.42, first ? 22 : 12);
    if (first && s.kind !== "sort"){
      FX.splurge(window.innerWidth / 2, window.innerHeight * 0.44);
      flyText("🍌 +1");
    }
    if (s.combo >= 5) FX.speedLines();
    showCombo(s.combo);
    const prog = $("#prog");
    if (prog) prog.style.boxShadow = s.combo >= 3 ? "0 0 14px rgba(255,201,60,.6)" : "none";
    haptic(12);

    flash("✓", true);
    bumpCar();
    s.i++;
    app._submit = null;
    setTimeout(renderQuestion, 250);
    return;
  }

  if (!rec) s.results.push({ id: word.id, firstTry: false, sent: !!word.__sent });
  s.combo = 0;
  showCombo(0);
  SND.wrong();
  flashVignette();
  haptic(20);
  bumpCar();

  if (s.kind === "sort"){
    flash("·", false);
    s.i++;
    app._submit = null;
    setTimeout(renderQuestion, 430);
    return;
  }

  s.tries[word.id] = (s.tries[word.id] || 0) + 1;

  if (s.tries[word.id] >= 3){
    SND.reveal();
    flash(word.en, true);
    toast(word.en + " · " + word.zh);
    s.i++;
    app._submit = null;
    setTimeout(renderQuestion, 1000);
    return;
  }
  if (s.tries[word.id] >= 2) s.easy[word.id] = true;
  flash("·", false);
  setTimeout(renderQuestion, 120);
}

function endSession(){
  const s = session;
  if (!s) return;
  clearInterval(s.timer);
  session = null;
  showCombo(0);

  const day = todayStr();
  const wasFull = s.i >= s.queue.length;

  if (s.kind === "sort"){
    for (const r of s.results){
      const w = state.words.filter(function(x){ return x.id === r.id; })[0];
      if (w) w.sorted = true;
    }
    state.car.parts += Math.floor(s.results.length / 4);
  } else {
    applySession(state, s.results, day);
  }
  state.today.done = true;
  state.lastSession = {
    date: day,
    kind: s.kind,
    items: s.results.map(function(r){
      const pool = r.sent ? (state.sentences || []) : state.words;
      const w = pool.filter(function(x){ return x.id === r.id; })[0];
      return { en: w ? w.en : "", zh: w ? w.zh : "", ok: !!r.firstTry };
    })
  };
  save();

  if (wasFull){
    SND.finish();
    FX.confetti();
  }

  const gained = s.kind === "sort"
    ? Math.floor(s.results.length / 4)
    : s.results.filter(function(r){ return r.firstTry; }).length;
  const lvl = lvlOf(state.car.parts);
  const kindWord = s.kind === "sort" ? "认完了"
    : (s.kind === "morning" ? "香蕉摘到了" : "练好了");

  app.innerHTML =
    '<div class="screen">' +
      '<div class="bar">' +
        '<span class="stripe"></span><span class="stripe y"></span>' +
        '<h1>🍌 猴子摘香蕉</h1><span class="spacer"></span>' +
        soundBtn() +
      "</div>" +
      '<div class="finish">' +
        '<div class="car' + (wasFull ? " run" : "") + '" id="car">🐵</div>' +
        '<div class="checker" style="margin:12px 0 6px"></div>' +
        '<div class="big">' + kindWord + "</div>" +
        '<div class="sub">' + (gained
          ? '摘到 <b style="color:var(--yellow)">' + gained + "</b> 根香蕉"
          : "猴子在树上") + "</div>" +
        '<div class="lvl" style="margin-top:14px">' + Array.from({ length: 9 }, function(_, i){
          return '<i class="' + (i < lvl ? "on" : "") + '">🍌</i>';
        }).join("") + "</div>" +
        '<div class="sub" style="margin-top:10px;color:var(--dim)">' +
          (lvl + 1) + " 级 · 共 " + state.car.parts + " 根香蕉</div>" +
      "</div>" +
      '<button class="cta alt" id="fin-back">回猴山</button>' +
      '<div class="hint">' + (wasFull ? "今天的摘完了" : "") + "</div>" +
    "</div>";

  $("#fin-back").onclick = function(){ SND.tap(); renderHome(); };
  $("#btn-sound").onclick = shiftSound;
}

/* ---------- 演示词 ---------- */
const DEMO_LINES = [
  "tiger 虎", "safari park 野生动物园", "lion 狮子", "whale 鲸",
  "panda 熊猫", "monkey 猴子", "elephant 大象", "giraffe 长颈鹿",
  "zebra 斑马", "kangaroo 袋鼠", "crocodile 鳄鱼", "snake 蛇",
  "dolphin 海豚", "penguin 企鹅", "camel 骆驼", "fox 狐狸",
  "rabbit 兔子", "squirrel 松鼠", "butterfly 蝴蝶", "tortoise 乌龟",
  "[句] The monkey is eating a banana. | 猴子正在吃香蕉。",
  "[句] Where does the tiger live? | 老虎住在哪里？"
];

function seedDemo(){
  const r = parseWords(DEMO_LINES.join("\n"));
  const dated = assignDates(r.items, new Date());
  state = emptyState();
  state.words = dated.filter(function(x){ return !x.__sent; }).map(function(w, i){
    return {
      id: "demo_w" + i,
      en: w.en, zh: w.zh, ipa: w.ipa || "", unit: "5AU4",
      box: 1, sorted: false, state: "hard",
      dictDate: w.dictDate, lastSeen: "", retired: false
    };
  });
  state.sentences = dated.filter(function(x){ return x.__sent; }).map(function(w, i){
    return {
      id: "demo_s" + i,
      en: w.en, zh: w.zh,
      box: 1, state: "hard",
      dictDate: w.dictDate, lastSeen: "", retired: false
    };
  });
  state.car.parts = 6;
  save();
}

/* ---------- 截图 / 调试入口 ---------- */
function runShot(shot){
  const now = new Date();
  if (shot === "sent"){
    const sents = (state.sentences || []);
    if (!sents.length){ toast("没有句子"); return; }
    startSession("evening", sents.slice(0, 2), "练一练 · 补句");
    return;
  }
  if (shot === "import"){ renderImport(); return; }
  if (shot === "panel"){ openPanel(); return; }

  if (shot === "morning" || shot === "typing"){
    const today = todayStr();
    state.words.slice(0, 4).forEach(function(w){
      w.dictDate = today; w.state = "hard"; w.box = 1;
    });
    save();
    startSession("morning", state.words.slice(0, shot === "typing" ? 2 : 4), "去摘香蕉");
    if (shot === "typing"){
      const a = $("#ans");
      if (a){
        a.value = "tige";
        a.dispatchEvent(new Event("input"));
        a.blur();
      }
    }
    return;
  }

  if (shot === "evening"){
    const today = todayStr();
    const dates = state.words
      .filter(function(w){ return w.dictDate && w.dictDate > today; })
      .map(function(w){ return w.dictDate; })
      .filter(function(v, i, arr){ return arr.indexOf(v) === i; })
      .sort();
    if (!dates.length){ toast("没有未来的词"); return; }
    const target = dates[0];
    startSession("evening", wordsOn(state, target).slice(0, 5),
      "调车 · " + dowCN(new Date(target + "T00:00:00")) + "那份");
    return;
  }

  if (shot === "sort"){
    startSession("sort", buildSortQueue(state, now).slice(0, 5), "认一圈");
    return;
  }

  if (shot === "done"){
    startSession("morning", state.words.slice(0, 3), "去摘香蕉");
    session.results = [{ id: session.queue[0].id, firstTry: true }];
    session.i = session.queue.length;
    endSession();
    return;
  }
}

/* ---------- 启动 ---------- */
(function boot(){
  SND.on = state.sound !== false;
  const q = new URLSearchParams(location.search);
  if (q.get("demo") === "1" && !state.words.length) seedDemo();

  window.__GAME__ = {
    get state(){ return state; },
    get session(){ return session; },
    renderHome: renderHome,
    renderImport: renderImport,
    startSession: startSession,
    seedDemo: seedDemo
  };

  renderHome();
  const shot = q.get("shot");
  if (shot) runShot(shot);
})();

document.addEventListener("pointerdown", function(){
  SND.init(); SND.resume();
}, { once: true });

document.addEventListener("keydown", function(e){
  if (e.key === "Enter" && app._submit){ app._submit(); }
});
